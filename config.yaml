global_llm_settings:
  model: "gemini-2.5-flash" # Default LLM model for agents if not specified individually
  temperature: 0.1 # Default temperature for LLM calls

agents:
  - name: "generic_summarizer"
    title: "Generic Summarizer"
    description: "Summarizes any text content."
    llm_model: "gemini-2.5-flash" # Ensure this model is available in your OpenWebUI setup
    output_schema: "summary"
    prompt: |
      Summarize the following content clearly and concisely.
      Do not refer to "this text" or "the document" in your answer.

workflows:
  - name: "summarize_document"
    description: "Summarize arbitrary input text."
    steps:
      - agent: "generic_summarizer"
        input:
          text_to_summarize: "{{ payload.content }}" # New input key
        output_to: "summary_result" # New output key

templates:
  summarize_document: |
    # Summary

    {{ context.summary_result.summary }}

defaults:
  max_tokens: 2048
  language: "en"
