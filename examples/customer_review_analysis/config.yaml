global_llm_settings:
  model: "gemini-2.5-flash"
  temperature: 0.0

agents:
  - name: review_summarizer
    description: "Summarizes a customer review into positive and negative points."
    prompt: |
      You are an expert at analyzing customer reviews.
      Summarize the following review, extracting the key positive and negative aspects mentioned by the user.

      Customer Review:
      {customer_review}
    output_schema: "summary" # Use the built-in summary schema

  - name: sentiment_analyzer
    description: "Analyzes the sentiment of a customer review."
    prompt: |
      You are an expert at sentiment analysis.
      Analyze the sentiment of the following customer review.
      Classify the sentiment as 'positive', 'negative', or 'neutral'.
      Provide a brief rationale for your classification.

      Customer Review:
      {customer_review}
    output_schema: "sentiment" # Use the built-in sentiment schema

workflows:
  - name: analyze_customer_review
    description: "Performs a full analysis of a customer review, including summarization and sentiment analysis."
    steps:
      - name: summarize_review
        agent: review_summarizer
        input:
          customer_review: "{{ payload.customer_review }}"
        output_to: summary

      - name: analyze_sentiment
        agent: sentiment_analyzer
        input:
          customer_review: "{{ payload.customer_review }}"
        output_to: sentiment

templates:
  analyze_customer_review: |
    Customer Review Analysis Complete:
    ---
    Sentiment: {{ context.sentiment.sentiment }}
    Rationale: {{ context.sentiment.rationale }}
    ---
    Summary:
    Positive Aspects:
    {% for point in context.summary.positive_aspects %}
    - {{ point }}
    {% endfor %}

    Negative Aspects:
    {% for point in context.summary.negative_aspects %}
    - {{ point }}
    {% endfor %}
