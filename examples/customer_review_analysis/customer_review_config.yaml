global_llm_settings:
  model: "gemini-2.5-flash" # Replace with your desired default model
  temperature: 0.2

agents:
  - name: "review_summarizer"
    title: "Review Summarizer"
    description: "Summarizes a customer review into key points."
    llm_model: "gemini-2.5-flash"
    output_schema: "summary"
    prompt: |
      Summarize the following customer review into a few concise bullet points.
      Focus on the main feedback, both positive and negative.

      Customer Review:
      {review_text} # Placeholder for the input

  - name: "review_sentiment_analyzer"
    title: "Review Sentiment Analyzer"
    description: "Analyzes the sentiment of a customer review."
    llm_model: "gemini-2.5-flash"
    output_schema: "sentiment"
    prompt: |
      Analyze the sentiment of the following customer review.
      Determine if the overall sentiment is positive, neutral, or negative.
      Provide a short rationale for your decision based on the text.

      Customer Review:
      {review_text} # Placeholder for the input

workflows:
  - name: "analyze_customer_review"
    description: "Summarizes a customer review and analyzes its sentiment."
    steps:
      - name: summarize_review_step # Optional name for the step
        agent: "review_summarizer"
        input: # Use 'input' dictionary
          review_text: "{{ payload.review_text }}" # Map payload to agent's prompt placeholder
        output_to: "summary_result" # Use 'output_to' for context key

      - name: analyze_sentiment_step # Optional name for the step
        agent: "review_sentiment_analyzer"
        input: # Use 'input' dictionary
          review_text: "{{ payload.review_text }}" # Map payload to agent's prompt placeholder
        output_to: "sentiment_result" # Use 'output_to' for context key

templates:
  analyze_customer_review: |
    # Customer Review Analysis Report
    ---
    ## Original Review:
    {{ payload.review_text }}
    ---
    ## Key Points (Summary):
    ### Positive Aspects:
    {% for aspect in context.summary_result.positive_aspects %}
    - {{ aspect }}
    {% endfor %}

    ### Negative Aspects:
    {% for aspect in context.summary_result.negative_aspects %}
    - {{ aspect }}
    {% endfor %}

    ---
    ## Sentiment Analysis:
    - **Sentiment:** {{ context.sentiment_result.sentiment | capitalize }}
    - **Rationale:** {{ context.sentiment_result.rationale }}
