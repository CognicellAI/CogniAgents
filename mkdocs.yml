# Project Information
site_name: CogniAgents Framework
site_description: A YAML-driven framework for creating and managing AI agents.
site_author: CogniAgents Team
repo_url: https://github.com/CognicellAI/CogniAgents # Replace with your actual repo URL
repo_name: CognicellAI/CogniAgents

# Theme Configuration
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Navigation Structure
nav:
  - Home: index.md
  - Core Concepts: core_concepts.md
  - Guides:
    - Adding Tools: guides/adding_tools.md
    - Built-in Schemas: guides/built_in_schemas.md
  - API Reference: api_reference.md
  - Contributing: contributing.md

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
