global_llm_settings:
  model: "test-model"
  temperature: 0.5

custom_schemas:
  mock_schema: "tests.unit.test_schemas.MockOutput"

prompt_components:
  politeness: "Be polite."

agents:
  - name: "summarizer_agent"
    description: "Summarizes text."
    prompt: "Summarize this: {text}"
    output_schema: "summary" # Matches mock in conftest.py

  - name: "sentiment_agent"
    description: "Analyzes sentiment."
    prompt: "Analyze sentiment for: {text}. {{ prompt_components.politeness }}"
    output_schema: "sentiment" # Matches mock in conftest.py
    llm:
      temperature: 0.0 # Override global setting

  - name: "responder_agent"
    description: "Responds to text."
    prompt: "Respond to: {text}"
    output_schema: "str" # Matches mock in conftest.py

